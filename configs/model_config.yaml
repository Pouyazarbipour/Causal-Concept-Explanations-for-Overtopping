random_forest:
  grid:
    - {n_estimators: 300, max_features: 0.33, min_samples_leaf: 1}
    - {n_estimators: 300, max_features: 0.5, min_samples_leaf: 2}
    - {n_estimators: 300, max_features: 0.75, min_samples_leaf: 4}
xgboost:
  grid:
    - {n_estimators: 600, learning_rate: 0.05, max_depth: 4, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 1}
    - {n_estimators: 600, learning_rate: 0.05, max_depth: 6, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 3}
    - {n_estimators: 1000, learning_rate: 0.03, max_depth: 8, subsample: 0.7, colsample_bytree: 0.7, min_child_weight: 5}
    - {n_estimators: 400, learning_rate: 0.1, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 2, reg_lambda: 5.0}
  # sign of d(log10 q*)/d(feature); only relationships with a defensible sign
  monotone: {rc_h: -1, ac_h: -1, gc_l: -1, gf: 1}
mlp:
  grid:
    - {width: 128, depth: 3, dropout: 0.05, lr: 2.0e-3, weight_decay: 1.0e-5}
    - {width: 256, depth: 3, dropout: 0.1, lr: 1.0e-3, weight_decay: 1.0e-4}
    - {width: 128, depth: 4, dropout: 0.0, lr: 1.0e-3, weight_decay: 1.0e-5}
  epochs: 150
  patience: 20
  batch_size: 256
ccw:
  backbone: {width: 128, depth: 3, dropout: 0.05, lr: 2.0e-3, weight_decay: 1.0e-5, latent: 64}
  concept_dim: 8
  encoder_hidden: 128
  interaction_rank: 4
  lr: 1.0e-3
  flow_lr: 1.0e-3
  batch_size: 256
  warmup_epochs: 30
  flow_epochs: 30
  align_epochs: 60
  refit_interval: 15
  flow_refit_epochs: 8
  cf_draws: 4
  patience: 15
  flow: {layers: 6, hidden: 64}
  weights: {cls: 1.0, nec: 0.1, suf: 0.1, ind: 0.1, int: 0.01, pres: 0.0}
  # loss-weight sensitivity (multipliers applied jointly to nec/suf/ind)
  weight_sensitivity: [0.01, 0.1, 1.0]
